<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(inter-latin-600-normal.woff2)}
@font-face{font-family:Anton;font-weight:400;src:url(anton-latin-400-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#1c1c1c;overflow:hidden;font-family:Inter,sans-serif}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#262626}
#panel{position:absolute;left:30px;top:24px;width:1860px;height:1032px;background:#1c1c1c;border-radius:14px}
.row{position:absolute;left:150px;width:1640px;height:112px;border-bottom:1px solid #000;background:#1b1b1b}
.label{position:absolute;left:0;top:0;width:240px;height:112px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:#1a1a1a;text-align:center}
.lock{font-size:40px;color:#777}
#tray-label{position:absolute;left:150px;top:858px;color:#fff;font-size:26px;font-weight:600}
#tray-label i{display:inline-block;width:14px;height:14px;background:#e0426a;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-right:14px}
.tile{position:absolute;width:112px;height:112px;overflow:hidden;color:#fff;font-family:Anton,Inter,sans-serif;font-weight:400;font-size:25px;line-height:1.02;letter-spacing:.3px;text-align:center;display:flex;align-items:center;justify-content:center;padding:4px;text-shadow:0 2px 3px #000,0 0 5px #000,0 0 2px #000;}
.tile span{position:relative;z-index:2}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.tile:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.5))}
#cursor{position:absolute;left:0;top:0;width:34px;height:40px;z-index:50;}
</style></head><body>
<div id="world">
<div id="panel"></div>
<div id="tray-label"><i></i>Pin Images</div>
<div id="cursor"><svg viewBox="0 0 24 28" width="34" height="40"><path d="M8 2.6c0-1 .8-1.8 1.8-1.8s1.8.8 1.8 1.8v8.2c.4-.4.9-.5 1.4-.4.6.1 1 .5 1.2 1 .4-.3 1-.4 1.5-.2.6.2 1 .7 1.2 1.2.4-.2 1-.2 1.5.1.6.4.9 1 .9 1.7v4.4c0 3-1.7 6.1-4.6 6.1h-4c-1.7 0-3-1-3.8-2.3L3.6 17c-.5-.9-.2-1.9.7-2.3.8-.4 1.7-.1 2.2.5L8 16.6z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
</div>
<script>
const world=document.getElementById('world');
const ROWS=[
 {k:"LOCK",label:"",color:"#2b2b2b"},
 {k:"MINUTES",label:"MINUTES",color:"#ff7f7f"},
 {k:"HOURS",label:"HOURS",color:"#ffbf7f"},
 {k:"DAYS",label:"DAYS",color:"#ffdf80"},
 {k:"WEEKS",label:"WEEKS",color:"#ffff7f"},
 {k:"MONTHS",label:"MONTHS",color:"#bfff7f"},
 {k:"SURVIVES",label:"SURVIVES",color:"#7fff7f"}];

// Painted-style tile art, drawn as SVG (112x112). Muted, darkened like the reference tiles.
const NOISE=`<filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0"/></filter>`;
const dead=(x,y,h,c)=>`<path d="M${x} ${y}v-${h}M${x} ${y-h*.55}l-${h*.28} -${h*.3}M${x} ${y-h*.7}l${h*.3} -${h*.25}" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
const pine=(x,y,h,c)=>`<path d="M${x} ${y-h}l${h*.28} ${h*.5}h-${h*.16}l${h*.2} ${h*.5}h-${h*.64}l${h*.2} -${h*.5}h-${h*.16}z" fill="${c}"/>`;
const ART={
 "impact-winter":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2326"/><stop offset=".6" stop-color="#6b4a3a"/><stop offset="1" stop-color="#c8743a"/></linearGradient><radialGradient id="r" cx=".5" cy=".78" r=".5"><stop offset="0" stop-color="#ffb060" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a30" stop-opacity="0"/></radialGradient></defs><rect width="112" height="112" fill="url(#g)"/><rect width="112" height="112" fill="url(#r)"/><path d="M20 0l30 62M50 0l22 50M82 0l12 40M8 18l22 30" stroke="#ffd9a0" stroke-width="1.6" opacity=".55"/><path d="M0 92c20-8 40-6 58-2s36 2 54-4v26H0z" fill="#1d1816"/>${dead(18,100,26,'#0e0b0a')}${dead(86,99,22,'#0e0b0a')}${dead(60,96,16,'#0e0b0a')}`,
 "big-freeze":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b87a8"/><stop offset=".65" stop-color="#b9d3e2"/><stop offset="1" stop-color="#eaf2f6"/></linearGradient></defs><rect width="112" height="112" fill="url(#g)"/><circle cx="82" cy="30" r="9" fill="#f4f1e2" opacity=".85"/><path d="M0 76c24-14 48-16 70-8s30 6 42 0v44H0z" fill="#dfeaf0"/><path d="M0 92c30-10 60-8 112-2v22H0z" fill="#f8fbfc"/>${pine(22,88,30,'#2f4a52')}${pine(46,92,24,'#2a4249')}${pine(92,90,28,'#2f4a52')}`,
 "supervolcano":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1112"/><stop offset=".7" stop-color="#6a2a1c"/><stop offset="1" stop-color="#b24a22"/></linearGradient></defs><rect width="112" height="112" fill="url(#g)"/><ellipse cx="56" cy="28" rx="40" ry="20" fill="#3a2f2e" opacity=".9"/><ellipse cx="40" cy="36" rx="26" ry="14" fill="#52403c" opacity=".8"/><ellipse cx="76" cy="38" rx="24" ry="12" fill="#4a3834" opacity=".8"/><path d="M0 112L38 62h36l38 50z" fill="#241615"/><path d="M48 64l5 -4h10l5 4z" fill="#ff7a30"/><path d="M56 64v18M52 70l-6 24M60 70l7 20" stroke="#ff8a3a" stroke-width="2.4" opacity=".85" stroke-linecap="round"/>`,
 "sea-dried":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a560"/><stop offset=".45" stop-color="#e9c88a"/><stop offset="1" stop-color="#b68548"/></linearGradient></defs><rect width="112" height="112" fill="url(#g)"/><circle cx="84" cy="22" r="10" fill="#fff3d0" opacity=".8"/><path d="M0 52h112v60H0z" fill="#a67a44"/><path d="M0 60c20-4 40 0 60-2s34 0 52-2v6c-18 2-34 0-52 2s-40-2-60 2z" fill="#5f8a98" opacity=".75"/><path d="M10 70l18 10-6 14M44 66l-8 18 20 10M80 72l-10 14 24 6M30 100l20-8M96 90l-16 18" stroke="#6c4a26" stroke-width="1.8" fill="none"/>`,
 "snowball":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6f8f"/><stop offset=".55" stop-color="#9ec6d8"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient></defs><rect width="112" height="112" fill="url(#g)"/><circle cx="56" cy="46" r="12" fill="#fff7e0" opacity=".8"/><path d="M0 62h112v50H0z" fill="#d6e8ef"/><path d="M0 72l20-8 14 8 22-10 18 10 20-8 18 8v40H0z" fill="#bcd6e2"/><path d="M0 88l24-6 20 6 28-8 40 8v26H0z" fill="#eef6f9"/><path d="M14 98l14-8M60 100l16-10M88 96l12-6" stroke="#8db3c4" stroke-width="1.6"/>`,
 "great-dying":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1110"/><stop offset=".6" stop-color="#7a3326"/><stop offset="1" stop-color="#b8512c"/></linearGradient></defs><rect width="112" height="112" fill="url(#g)"/><ellipse cx="60" cy="24" rx="50" ry="16" fill="#3b2220" opacity=".8"/><circle cx="28" cy="30" r="8" fill="#e9a070" opacity=".55"/><path d="M0 86c26-6 52-4 74 0s26 2 38-2v28H0z" fill="#241210"/><path d="M0 98l30-3 22 4 28-4 32 3" stroke="#ff7a30" stroke-width="2.2" fill="none"/>${dead(22,92,28,'#120807')}${dead(68,90,22,'#120807')}${dead(96,92,26,'#120807')}`,
 "megaflood":`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d8a9a"/><stop offset=".4" stop-color="#2f6ea0"/><stop offset="1" stop-color="#16406a"/></linearGradient></defs><rect width="112" height="112" fill="url(#g)"/><path d="M0 0h26l-8 56H0zM112 0H86l10 60h16z" fill="#6a4a32"/><path d="M0 62c14-12 26-10 40-2s26 8 40-2 22-6 32 0v54H0z" fill="#3f86b8"/><path d="M0 80c16-10 30-8 44 0s30 8 44-2 18-4 24 0v34H0z" fill="#2a6ea0"/><path d="M0 98c18-8 32-6 48 0s30 6 64-2v16H0z" fill="#1c5588"/><path d="M12 66q6-8 14 0M52 62q6-8 14 0M84 70q6-8 14 0" stroke="#e6f3fa" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
 "impact-day":`<defs><radialGradient id="r" cx=".5" cy=".72" r=".6"><stop offset="0" stop-color="#fff6d0"/><stop offset=".25" stop-color="#ffb04a"/><stop offset=".6" stop-color="#b8431c"/><stop offset="1" stop-color="#20100c"/></radialGradient></defs><rect width="112" height="112" fill="url(#r)"/><circle cx="56" cy="80" r="30" fill="none" stroke="#ffe3b0" stroke-width="1.6" opacity=".55"/><circle cx="56" cy="80" r="46" fill="none" stroke="#ffd29a" stroke-width="1.4" opacity=".35"/><path d="M0 84c24-8 48-6 70-2s30 2 42-2v32H0z" fill="#1a0e0b"/><path d="M50 84c0-20 4-34 6-44 2 10 6 24 6 44z" fill="#ffd9a0" opacity=".85"/>`
};
const TILES=[
 {id:"impact-winter",name:"Impact Winter"},
 {id:"big-freeze",name:"The Big Freeze"},
 {id:"supervolcano",name:"Supervolcano"},
 {id:"sea-dried",name:"The Sea That Dried Up"},
 {id:"snowball",name:"Snowball Earth"},
 {id:"great-dying",name:"The Great Dying"},
 {id:"megaflood",name:"Megaflood"},
 {id:"impact-day",name:"Impact Day"}];
const svgURI=id=>{const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">${NOISE}${ART[id]}<rect width="112" height="112" filter="url(#n)" opacity=".35"/></svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);};

const ROW_X=150, LABEL_W=240, ROW_Y0=40, ROW_H=112, TRAY_X=150, TRAY_Y=898, SZ=112;
const rowY=i=>ROW_Y0+i*ROW_H;
const rowIndex=k=>ROWS.findIndex(r=>r.k===(k==='SECONDS'?'LOCK':k));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const panel=document.getElementById('panel');
const rowEls=ROWS.map((r,i)=>{
  const d=document.createElement('div');d.className='row';d.style.top=rowY(i)+'px';
  d.innerHTML=`<div class="label" style="background:${r.color}">${r.k==="LOCK"?'<span class="lock">&#128274;</span>':r.label}</div>`;
  world.appendChild(d);return d;});
const tileEls={};
TILES.forEach(t=>{const e=document.createElement('div');e.className='tile';e.innerHTML=`<img src="../assets/tiles/${t.id}.png" onerror="this.onerror=null;this.src=svgURI('${t.id}')"><span${t.name.length>11&&!t.name.includes(' ')?' style="font-size:20px"':''}>${t.name}</span>`;world.appendChild(e);tileEls[t.id]=e;});
const cursor=document.getElementById('cursor');
const trayPos=slot=>[TRAY_X+slot*SZ,TRAY_Y];
const rowSlotPos=(row,idx)=>[ROW_X+LABEL_W+idx*SZ,rowY(rowIndex(row))];

// Camera: wide board -> zoom to tray + target row -> back out. Hard focus like the reference, eased.
function camera(t,S){
  const M=S.move; let s=1,cx=960,cy=540;
  if(M&&S.cam){
    const rowTop=rowY(rowIndex(M.row));
    const top=Math.max(0,rowTop-ROW_H), bottom=TRAY_Y+SZ+36;
    const zs=clamp(1080/(bottom-top),1.0,2.2);
    const fx=ROW_X-60+960/zs, fy=top+540/zs;
    const [zin,zdur,zout,zodur]=S.cam;
    const a=easeSine(clamp((t-zin)/zdur)), b=easeSine(clamp((t-zout)/zodur));
    const k=a*(1-b);
    s=1+(zs-1)*k; cx=960+(fx-960)*k; cy=540+(fy-540)*k;
  }
  world.style.transform=`translate(${960-cx*s}px,${540-cy*s}px) scale(${s})`;
}

function draw(t,S){
  const fi=S.fadeIn?easeOut(clamp((t-S.fadeIn[0])/S.fadeIn[1])):1;
  [panel,document.getElementById('tray-label'),...rowEls].forEach(e=>e.style.opacity=fi);
  camera(t,S);
  const trayIds=TILES.map(x=>x.id).filter(id=>!S.placed.some(p=>p.id===id));
  const rowCount={};S.placed.forEach(p=>{rowCount[p.row]=(rowCount[p.row]||0)+1;});
  const M=S.move; const placedPos={}; const counters={};
  S.placed.forEach(p=>{const n=counters[p.row]=(counters[p.row]||0);counters[p.row]++;placedPos[p.id]=rowSlotPos(p.row,n);});
  const layoutIds=trayIds.slice();
  let drag=null;
  if(M){
    const t0=M.t0, tPress=t0+0.7, tDragStart=t0+0.95, tDrop=t0+2.75, tRelease=t0+3.05;
    const slot0=trayIds.indexOf(M.id);
    const start=trayPos(slot0);
    const idx=rowCount[M.row]||0; const end=rowSlotPos(M.row,idx);
    const cStart=[start[0]+330,start[1]+20], cTile=[start[0]+70,start[1]+66], cEnd=[end[0]+70,end[1]+66];
    let cx,cy,pressed=false,pos=start,scale=1;
    if(t<tPress){const k=ease(clamp((t-t0)/0.7));cx=cStart[0]+(cTile[0]-cStart[0])*k;cy=cStart[1]+(cTile[1]-cStart[1])*k;}
    else if(t<tDragStart){cx=cTile[0];cy=cTile[1];pressed=true;}
    else if(t<tDrop){
      const k=ease(clamp((t-tDragStart)/(tDrop-tDragStart)));
      const c=[(cTile[0]+cEnd[0])/2+120,Math.min(cTile[1],cEnd[1])-70];
      const bez=(a,b,cc)=>(1-k)*(1-k)*a+2*(1-k)*k*b+k*k*cc;
      cx=bez(cTile[0],c[0],cEnd[0]);cy=bez(cTile[1],c[1],cEnd[1]);pressed=true;
    } else {cx=cEnd[0];cy=cEnd[1];}
    if(t>=tRelease){const k=clamp((t-tRelease)/0.6);cx=cEnd[0]+260*ease(k);cy=cEnd[1]+90*ease(k);}
    if(pressed){pos=[cx-70,cy-66];scale=1.04;}
    else if(t>=tDrop){pos=end;}
    drag={pos,scale,pressed,placed:t>=tDrop};
    if(t>=tDrop){layoutIds.splice(slot0,1);}
    const cvis=clamp((t-t0)/0.25)*(t<tRelease+0.6?1:1-clamp((t-tRelease-0.6)/0.25));
    cursor.style.opacity=cvis;
    cursor.style.transform=`translate(${cx-10}px,${cy-4}px)`;
  } else {cursor.style.opacity=0;}
  TILES.forEach(tl=>{
    const e=tileEls[tl.id];let x,y,s=1,op=fi;
    if(placedPos[tl.id]){[x,y]=placedPos[tl.id];}
    else if(M&&tl.id===M.id){[x,y]=drag.pos;s=drag.scale;op=drag.pressed?0.78:1;if(drag.placed)s=1;}
    else{
      const slot=layoutIds.indexOf(tl.id); let sl=slot;
      if(M){const slot0=trayIds.indexOf(M.id);const orig=trayIds.indexOf(tl.id);
        const k=easeOut(clamp((t-(M.t0+2.75))/0.4));sl=orig-(orig>slot0?k:0);}
      [x,y]=trayPos(sl);
    }
    e.style.transform=`translate(${x+1}px,${y+1}px) scale(${s})`;
    e.style.opacity=op*(fi);
    e.style.zIndex=(M&&tl.id===M.id)?40:10;
  });
  const lockLabel=rowEls[0].querySelector('.label');
  if(S.unlock){const k=ease(clamp((t-S.unlock.t0)/0.8));
    lockLabel.style.background=k>.5?'#ff4d4d':ROWS[0].color;
    lockLabel.innerHTML=k>.5?`<span style="opacity:${clamp((k-.5)*2)};font-size:26px">SECONDS</span>`:'<span class="lock">&#128274;</span>';}
}
window.draw=draw;
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:600;src:url(inter-latin-600-normal.woff2)}
@font-face{font-family:Anton;font-weight:400;src:url(anton-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
.seg{position:absolute;inset:0;overflow:hidden;opacity:0}
.seg img.bg{position:absolute;left:0;top:0;display:block}
.glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.sweep{position:absolute;inset:0;pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 48%,rgba(0,0,0,.72) 100%)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;image-rendering:pixelated;mix-blend-mode:overlay;opacity:.11;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
#card .t{font-family:Anton,sans-serif;font-size:210px;letter-spacing:8px;color:#f4ece2;text-shadow:0 6px 30px rgba(0,0,0,.8);line-height:1}
#card .l{width:0;height:3px;background:#e0884a;margin:34px 0 30px}
#card .s{font-family:Inter,sans-serif;font-weight:600;font-size:40px;color:#e8d3b4;letter-spacing:1.5px}
#label{position:absolute;left:90px;bottom:90px;font-family:Anton,sans-serif;font-size:58px;letter-spacing:3px;color:#f4ece2;opacity:0;text-shadow:0 4px 18px rgba(0,0,0,.9)}
#label:before{content:"";display:block;width:90px;height:4px;background:#e0884a;margin-bottom:16px}
</style></head><body>
<div id="stage"></div>
<canvas id="fx" width="1920" height="1080"></canvas>
<div id="vig"></div>
<div id="card"><div class="t">IMPACT WINTER</div><div class="l"></div><div class="s">66 million years ago &middot; far side of the planet</div></div>
<div id="label"></div>
<canvas id="grain" width="480" height="270"></canvas>
<div id="fade"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// Timeline, seconds. SEGS follow the narration timing in the SRT and the script cues.
const MONT=['impact-winter','big-freeze','supervolcano','sea-dried','snowball','great-dying','megaflood','impact-day'];
const SEGS=[
 // [VISUAL: a far-off glow below the horizon. Sky darkening from one edge.]
 {t0:0,   t1:8.4,  img:'impact-winter', cam:[[1.12,.66,.62],[1.5,.74,.60]], sat:[1,.85], bri:[.75,.95], sweep:[0,1], glow:{x:.74,y:.6,a:[.15,.4]}, embers:0},
 // temperature dropping, every green thing stops growing
 {t0:8.4, t1:14.6, img:'impact-winter', cam:[[1.55,.18,.52],[1.3,.30,.55]], sat:[.7,.2], bri:[.8,.55], embers:30},
 // one of eight catastrophes: each image flashes in
 ...MONT.map((m,i)=>({t0:14.6+i*0.8,t1:15.4+i*0.8,img:m,cam:[[1.0,.4+i*.03,.5],[1.14,.5,.5]],sat:[.95,.95],bri:[.8,.8],fast:true})),
 // tier board (composited in ffmpeg on top of this black)
 {t0:21.0,t1:33.8,black:true},
 // chapter card
 {t0:33.6,t1:37.9,img:'impact-winter',cam:[[1.35,.5,.5],[1.25,.5,.5]],sat:[.5,.5],bri:[.22,.22],blur:12,card:true},
 // 66 million years ago, asteroid struck Mexico
 {t0:37.8,t1:45.8,img:'IMPACTREAL',cam:[[1.05,.52,.52],[1.45,.56,.64]],sat:[.5,.5],bri:[.5,.6],tint:.35,ripple:{x:.56,y:.66,t:39.4},label:'CHICXULUB · YUCATÁN',labelAt:38.6},
 // horizon starting to glow, streaks of light across the whole sky
 {t0:45.6,t1:52.2,img:'impact-winter',cam:[[1.05,.5,.55],[1.4,.72,.6]],sat:[1,.95],bri:[.8,.9],glow:{x:.72,y:.6,a:[.25,.5]},streaks:true},
 // first day is the dangerous one, debris falling all over the world
 {t0:52.0,t1:60,img:'impact-winter',cam:[[1.1,.4,.55],[1.0,.5,.5]],sat:[.95,.5],bri:[.85,.35],embers:150,streaks:true}
];
const END=59.376;
const IMGS={};
const stage=document.getElementById('stage');
let mapName={'IMPACTREAL':null};
const segEls=SEGS.map((s,i)=>{
  const d=document.createElement('div');d.className='seg';
  if(s.black){d.style.background='radial-gradient(ellipse at 50% 40%,#1a0f0c 0%,#050303 70%)';}
  stage.appendChild(d);
  if(s.glow){const g=document.createElement('div');g.className='glow';d.appendChild(g);d._glow=g;}
  if(s.sweep){const g=document.createElement('div');g.className='sweep';d.appendChild(g);d._sweep=g;}
  return d;});
async function load(real){
  mapName.IMPACTREAL=real||'impact-day';
  const names=[...new Set(SEGS.filter(s=>s.img).map(s=>s.img==='IMPACTREAL'?mapName.IMPACTREAL:s.img))];
  await Promise.all(names.map(n=>new Promise(res=>{const im=new Image();im.onload=()=>{IMGS[n]=im;res();};im.onerror=()=>res();im.src='../assets/'+n+'.jpg';})));
  SEGS.forEach((s,i)=>{if(!s.img)return;const n=s.img==='IMPACTREAL'?mapName.IMPACTREAL:s.img;const im=IMGS[n];if(!im)return;
    const e=document.createElement('img');e.className='bg';e.src=im.src;e._asp=im.naturalWidth/im.naturalHeight;segEls[i].insertBefore(e,segEls[i].firstChild);segEls[i]._img=e;});
  await document.fonts.ready;
}
const fx=document.getElementById('fx').getContext('2d');
const grain=document.getElementById('grain'),gx=grain.getContext('2d');
function draw(t,frame){
  let activeEmbers=0,activeStreaks=false,rip=null;
  SEGS.forEach((s,i)=>{
    const el=segEls[i];
    const fadeIn=i===0?1:clamp((t-s.t0)/(s.fast?0.22:0.7));
    const next=SEGS[i+1];
    const vis=t>=s.t0&&t<=s.t1+0.9;
    el.style.opacity=vis?fadeIn:0;
    if(!vis)return;
    const k=clamp((t-s.t0)/(s.t1-s.t0)), ke=ease(k);
    if(el._img){
      const [a,b]=s.cam; const sc=lerp(a[0],b[0],ke), fxn=lerp(a[1],b[1],ke), fyn=lerp(a[2],b[2],ke);
      const asp=el._img._asp;
      let W2=1080*asp*sc, H2=1080*sc; if(W2<1920*sc){const f=1920*sc/W2;W2*=f;H2*=f;}
      let left=960-fxn*W2, top=540-fyn*H2; left=clamp(left,1920-W2,0); top=clamp(top,1080-H2,0);
      el._img.style.width=W2+'px';el._img.style.height=H2+'px';el._img.style.left=left+'px';el._img.style.top=top+'px';
      const sat=lerp(s.sat[0],s.sat[1],k), br=lerp(s.bri[0],s.bri[1],k);
      el._img.style.filter=`saturate(${sat}) brightness(${br}) contrast(1.12)${s.tint?` sepia(${s.tint})`:''}${s.blur?` blur(${s.blur}px)`:''}`;
      if(el._glow&&s.glow){const gx_=left+s.glow.x*W2, gy_=top+s.glow.y*H2;
        const pulse=lerp(s.glow.a[0],s.glow.a[1],k)*(0.85+0.15*Math.sin(t*5.3)+0.05*Math.sin(t*13.1));
        el._glow.style.background=`radial-gradient(ellipse 620px 320px at ${gx_}px ${gy_}px,rgba(255,150,60,${pulse}) 0%,rgba(255,90,20,${pulse*.35}) 45%,rgba(0,0,0,0) 80%)`;}
    }
    if(el._sweep&&s.sweep){const p=lerp(-25,92,ease(k));
      el._sweep.style.background=`linear-gradient(270deg,rgba(4,4,8,.72) 0%,rgba(4,4,8,.66) ${p-25}%,rgba(4,4,8,0) ${p+10}%)`;}
    if(s.embers&&t>=s.t0&&t<=s.t1) activeEmbers=Math.max(activeEmbers,s.embers*clamp((t-s.t0)/1.2));
    if(s.streaks&&t>=s.t0&&t<=s.t1) activeStreaks=true;
    if(s.ripple&&el._img&&t>=s.t0){const rl=parseFloat(el._img.style.left),rt=parseFloat(el._img.style.top),rw=parseFloat(el._img.style.width),rh=parseFloat(el._img.style.height);rip={x:rl+s.ripple.x*rw,y:rt+s.ripple.y*rh,t:s.ripple.t,t1:s.t1};}
    if(s.label){const L=document.getElementById('label');L.textContent=s.label;L.style.opacity=clamp((t-s.labelAt)/0.6)*(t<s.t1+0.2?1:0);}
  });
  // chapter card
  const c=document.getElementById('card');const cs=SEGS.find(s=>s.card);
  const ct=t-cs.t0+0.0;
  c.style.opacity=clamp((t-(cs.t0+0.5))/0.9)*clamp((cs.t1+0.2-t)/0.5);
  c.querySelector('.t').style.transform=`translateY(${(1-clamp((t-(cs.t0+0.5))/1.1))*24}px)`;
  c.querySelector('.l').style.width=(900*ease(clamp((t-(cs.t0+1.1))/0.9)))+'px';
  c.querySelector('.s').style.opacity=clamp((t-(cs.t0+1.7))/0.8);
  // fx: embers + streaks
  fx.clearRect(0,0,1920,1080);
  if(activeEmbers>0){
    const r=rng(7);
    for(let i=0;i<Math.round(activeEmbers);i++){
      const x0=r()*2100-100, y0=r()*1200, sp=60+r()*160, sz=1+r()*2.6, ph=r()*6.28, dr=(r()-.5)*40;
      const y=((y0+t*sp)%1260)-90, x=x0+Math.sin(t*0.8+ph)*30+t*dr*0.2-t*20;
      const hot=r()<.45; const al=(0.25+r()*0.5)*(0.7+0.3*Math.sin(t*3+ph));
      fx.fillStyle=hot?`rgba(255,${130+Math.floor(r()*70)},60,${al})`:`rgba(190,180,170,${al*.7})`;
      fx.beginPath();fx.arc(((x%2200)+2200)%2200-140,y,sz,0,6.283);fx.fill();
    }
  }
  if(rip&&t>=rip.t&&t<=rip.t1+0.4){
    for(let j=0;j<4;j++){const tt=(t-rip.t-j*0.9);if(tt<0)continue;const rad=60+tt*260,al=Math.max(0,1-tt/3.2)*0.85;
      fx.strokeStyle=`rgba(255,${150+j*18},80,${al})`;fx.lineWidth=3.5-j*.5;fx.beginPath();fx.arc(rip.x,rip.y,rad,0,6.283);fx.stroke();}
    const pulse=Math.max(0,1-(t-rip.t)/1.4);
    const g=fx.createRadialGradient(rip.x,rip.y,0,rip.x,rip.y,220);g.addColorStop(0,`rgba(255,220,160,${.8*pulse})`);g.addColorStop(1,'rgba(255,120,40,0)');fx.fillStyle=g;fx.fillRect(rip.x-240,rip.y-240,480,480);
  }
  if(activeStreaks){
    const r=rng(99);
    for(let i=0;i<22;i++){
      const ts=45.8+r()*5.5+(t>=52?7:0)*0, x0=r()*1500+100, y0=-60+r()*260, len=260+r()*320, spd=1500+r()*900;
      const tt=t-((t>=52)?(52+r()*6):ts); if(tt<0||tt>1.1){continue;}
      const dx=0.55,dy=0.83; const hx=x0+dx*spd*tt, hy=y0+dy*spd*tt;
      const al=Math.sin(Math.min(1,tt/1.1)*Math.PI);
      const g=fx.createLinearGradient(hx,hy,hx-dx*len,hy-dy*len);
      g.addColorStop(0,`rgba(255,235,200,${al})`);g.addColorStop(.25,`rgba(255,150,60,${al*.7})`);g.addColorStop(1,'rgba(255,90,20,0)');
      fx.strokeStyle=g;fx.lineWidth=2.5+r()*2;fx.lineCap='round';fx.beginPath();fx.moveTo(hx,hy);fx.lineTo(hx-dx*len,hy-dy*len);fx.stroke();
    }
  }
  // grain
  const id=gx.createImageData(480,270);const rr=rng(1000+frame);
  for(let i=0;i<id.data.length;i+=4){const v=Math.floor(rr()*255);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
  gx.putImageData(id,0,0);
  // global fade-out at end
  document.getElementById('fade').style.opacity=clamp((t-(END-1.3))/1.2);
}
window.load=load;window.draw=draw;
</script></body></html>

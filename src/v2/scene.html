<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(../node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
:root{--bg:#0A0A0A;--text:#FFFFFF;--sub:#9A9A9A;--money:#3DDC84;--yellow:#FFD60A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;color:var(--text)}
body.preview-bg{background:#3A3F47}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#stage.fs{background:radial-gradient(ellipse at 50% 45%,#1A1A1A 0%,#0A0A0A 70%)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.num{font-weight:900;color:var(--money);line-height:1;letter-spacing:-0.035em}
.head{font-weight:800;line-height:1.08;letter-spacing:-0.02em}
.money{color:var(--money)}
.kw{background:linear-gradient(var(--yellow),var(--yellow)) no-repeat 0 55%/0% 100%;border-radius:.14em;padding:0 .16em;margin:0 .02em;color:#0A0A0A;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wd{display:inline-block}
.src{position:absolute;left:100px;bottom:56px;font-size:36px;font-weight:500;color:var(--sub)}
.glass{background:#121212;border:2px solid #2C2C2C;border-radius:36px}
</style></head>
<body><div id="stage"><div id="cam"></div></div>
<script src="items.js"></script>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const tracks=[];
const ctx={
  // words pop in one after another: fade, small scale up, short rise. no overshoot.
  pop(el,at,stagger=0.09,dur=0.42){
    const words=[];
    const walk=n=>{[...n.childNodes].forEach(ch=>{
      if(ch.nodeType===3){const frag=document.createDocumentFragment();
        ch.textContent.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){frag.append(document.createTextNode(' '));return;}
          const s=document.createElement('span');s.className='wd';s.textContent=tok;frag.append(s);words.push(s);});
        ch.replaceWith(frag);}
      else if(ch.nodeType===1&&!ch.classList.contains('wd'))walk(ch);});};
    walk(el);
    tracks.push(t=>{words.forEach((w,i)=>{const p=easeOut((t-at-i*stagger)/dur);w.style.opacity=p;w.style.transform=`translateY(${(1-p)*26}px) scale(${0.86+0.14*p})`;});});
    // keyword boxes wipe in after their words land
    el.querySelectorAll('.kw').forEach(k=>{const idx=words.indexOf(k.querySelector('.wd')||k);const st=at+Math.max(0,idx)*stagger+0.25;
      tracks.push(t=>{k.style.backgroundSize=`${easeOut((t-st)/0.45)*100}% 100%`;});});
    return words.length;
  },
  enter(el,at,{dur=0.5,dy=40}={}){tracks.push(t=>{const p=easeOut((t-at)/dur);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px) scale(${0.96+0.04*p})`;});},
  count(el,at,from,to,fmt,dur=1.0){tracks.push(t=>{const p=easeOut((t-at)/dur);el.textContent=fmt(Math.round(from+(to-from)*p));});},
  custom(fn){tracks.push(fn);},
  el(html,cls='',style=''){const d=document.createElement('div');d.className=cls;d.style.cssText=style;d.innerHTML=html;return d;},
};
window.setup=async(id)=>{
  const it=ITEMS[id];const st=document.getElementById('stage');const cam=document.getElementById('cam');
  if(it.fs){st.classList.add('fs');tracks.push(t=>{cam.style.transform=`scale(${1+0.05*clamp(t/it.dur)})`;});}
  it.build(cam,ctx,it);
  await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));
  return {dur:it.dur,frames:Math.round(it.dur*30),fs:!!it.fs};
};
window.renderAt=t=>{tracks.forEach(f=>f(t));};
</script></body></html>

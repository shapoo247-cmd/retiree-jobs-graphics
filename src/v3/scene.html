<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(../node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
/* Theme: Studio Light. Cool paper greys, deep ink, emerald for money, amber for the one key idea. */
:root{--bg:#F1F3F6;--ink:#0B1220;--sub:#5B6676;--money:#08804F;--amber:#FFB400;--card:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
body.preview-bg{background:#3A3F47}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#stage.fs{background:radial-gradient(ellipse at 50% 40%,#FBFBFC 0%,#F1F3F6 55%,#E3E6EB 100%)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.num{font-weight:900;color:var(--money);line-height:1;letter-spacing:-0.04em}
.head{font-weight:800;line-height:1.08;letter-spacing:-0.025em}
.money{color:var(--money)}
.kw{background:linear-gradient(rgba(255,180,0,.62),rgba(255,180,0,.62)) no-repeat 0 62%/0% 78%;border-radius:.1em;padding:0 .1em;margin:0 .02em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wd{display:inline-block}
.src{position:absolute;left:100px;bottom:56px;font-size:36px;font-weight:500;color:var(--sub)}
.card{background:var(--card);border-radius:36px;box-shadow:0 40px 80px -24px rgba(11,18,32,.22),0 10px 24px rgba(11,18,32,.07)}
</style></head>
<body><div id="stage"><div id="bg"></div><div id="cam"></div></div>
<script src="items.js"></script>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const expo=x=>{x=clamp(x);return x>=1?1:1-Math.pow(2,-9*x);};   // fast start, long soft landing
const tracks=[];
const ctx={
  // rise: fade in out of a focus pull (blur to sharp), travel up, settle from slightly large
  rise(el,at,{dur=0.9,dy=90,blur=18,s=1.03}={}){tracks.push(t=>{const p=expo((t-at)/dur);
    el.style.opacity=clamp(p*2);el.style.filter=p<1?`blur(${((1-p)*blur).toFixed(2)}px)`:'none';
    el.style.transform=`translateY(${((1-p)*dy).toFixed(2)}px) scale(${(s-(s-1)*p).toFixed(4)})`;});},
  // words come in one after another, each with a short focus pull
  words(el,at,stagger=0.1,dur=0.8){
    const ws=[];const walk=n=>{[...n.childNodes].forEach(ch=>{
      if(ch.nodeType===3){const fr=document.createDocumentFragment();
        ch.textContent.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){fr.append(document.createTextNode(' '));return;}
          const s=document.createElement('span');s.className='wd';s.textContent=tok;fr.append(s);ws.push(s);});ch.replaceWith(fr);}
      else if(ch.nodeType===1&&!ch.classList.contains('wd'))walk(ch);});};
    walk(el);
    tracks.push(t=>{ws.forEach((w,i)=>{const p=expo((t-at-i*stagger)/dur);w.style.opacity=clamp(p*2);w.style.filter=p<1?`blur(${((1-p)*12).toFixed(2)}px)`:'none';
      w.style.transform=`translateY(${((1-p)*50).toFixed(2)}px)`;});});
    el.querySelectorAll('.kw').forEach(k=>{const w=k.querySelector('.wd');const idx=Math.max(0,ws.indexOf(w));const st=at+idx*stagger+0.35;
      tracks.push(t=>{k.style.backgroundSize=`${(expo((t-st)/0.6)*100).toFixed(2)}% 78%`;});});
  },
  wipe(k,at,dur=0.6){tracks.push(t=>{k.style.backgroundSize=`${(expo((t-at)/dur)*100).toFixed(2)}% 78%`;});},
  count(el,at,from,to,fmt,dur=1.4){tracks.push(t=>{const p=expo((Math.round(t*30)/30-at)/dur); // one value per frame, so motion blur never mixes two digits
    el.textContent=fmt(Math.round(from+(to-from)*p));});},
  custom(fn){tracks.push(fn);},
  el(html,cls='',style=''){const d=document.createElement('div');d.className=cls;d.style.cssText=style;d.innerHTML=html;return d;},
};
window.setup=async(id)=>{
  const it=ITEMS[id];const st=document.getElementById('stage');const cam=document.getElementById('cam');const bg=document.getElementById('bg');
  if(it.fs){st.classList.add('fs');
    // two large tonal shapes drift slower than the content: gentle parallax and depth
    const a=ctx.el('','abs','width:1000px;height:1000px;border-radius:500px;background:#E8EBF0;left:1180px;top:-380px');
    const b=ctx.el('','abs','width:760px;height:760px;border-radius:380px;background:#EAEDF2;left:-240px;top:690px');
    bg.append(a,b);
    tracks.push(t=>{t=Math.round(t*30)/30;const p=clamp(t/it.dur);a.style.transform=`translate(${(-60*p).toFixed(2)}px,${(36*p).toFixed(2)}px)`;b.style.transform=`translate(${(50*p).toFixed(2)}px,${(-30*p).toFixed(2)}px)`;
      cam.style.transform=`scale(${(1+0.06*p).toFixed(4)})`;});}
  it.build(cam,ctx,it);
  await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));
  return {dur:it.dur,frames:Math.round(it.dur*30),fs:!!it.fs};
};
window.renderAt=t=>{tracks.forEach(f=>f(t));};
</script></body></html>
